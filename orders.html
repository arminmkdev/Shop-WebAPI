<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>My Orders | Shop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/site.css" rel="stylesheet" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Shop</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mainNav" class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">
                Cart
                <span id="cartCount" class="badge text-bg-primary">0</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html">My Orders</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="admin.html">Admin</a>
            </li>
          </ul>
          <div class="d-flex gap-2" id="authNav">
            <a class="btn btn-outline-light btn-sm" href="login.html">Login</a>
            <a class="btn btn-primary btn-sm" href="register.html">Register</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4 py-md-5">
      <div
        class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4"
      >
        <div>
          <h1 class="h3 mb-1">My Orders</h1>
          <p class="text-secondary mb-0">View your orders and order details.</p>
        </div>

        <button
          type="button"
          id="refreshOrdersButton"
          class="btn btn-outline-primary"
        >
          Refresh Orders
        </button>
      </div>

      <div
        id="pageMessage"
        class="alert d-none"
        role="alert"
        aria-live="polite"
      ></div>

      <section class="card border-0 shadow-sm">
        <div
          class="card-header bg-white py-3 d-flex justify-content-between align-items-center"
        >
          <h2 class="h6 mb-0">Order History</h2>
          <span class="badge text-bg-light" id="orderCount">0 orders</span>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col" class="ps-3">Order ID</th>
                <th scope="col">Status</th>
                <th scope="col">Total</th>
                <th scope="col" class="text-end pe-3">Actions</th>
              </tr>
            </thead>

            <tbody id="ordersRows">
              <tr>
                <td colspan="4" class="text-center text-secondary py-5">
                  Loading orders...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <div class="mt-3">
        <a href="index.html" class="text-decoration-none">
          &larr; Continue Shopping
        </a>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/orders.js"></script>
  </body>
</html>
