<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Details</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Shop</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mainNav" class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">
                Cart
                <span id="cartCount" class="badge text-bg-primary">0</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html">My Orders</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="admin.html">Admin</a>
            </li>
          </ul>
          <div class="d-flex gap-2" id="authNav">
            <a class="btn btn-outline-light btn-sm" href="login.html">Login</a>
            <a class="btn btn-primary btn-sm" href="register.html">Register</a>
          </div>
        </div>
      </div>
    </nav>
    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Order Details</h2>
        <a href="orders.html" class="btn btn-outline-secondary">
          Back to Orders
        </a>
      </div>

      <div id="pageMessage" class="alert d-none"></div>

      <section class="card mb-4">
        <div class="card-body">
          <p class="mb-2">
            <strong>Order ID:</strong>
            <span id="orderId">—</span>
          </p>
          <p class="mb-2">
            <strong>Status:</strong>
            <span id="orderStatus">—</span>
          </p>
          <p class="mb-0">
            <strong>Total:</strong>
            <span id="orderTotal">—</span>
          </p>
        </div>
      </section>

      <h4 class="mb-3">Order Items</h4>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Product ID</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="orderDetailsRows"></tbody>
        </table>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/order-details.js"></script>
  </body>
</html>
