<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop | Products</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/site.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Shop</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mainNav" class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">
                Cart
                <span id="cartCount" class="badge text-bg-primary">0</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html">My Orders</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="admin.html">Admin</a>
            </li>
          </ul>
          <div class="d-flex gap-2" id="authNav">
            <a class="btn btn-outline-light btn-sm" href="login.html">Login</a>
            <a class="btn btn-primary btn-sm" href="register.html">Register</a>
          </div>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      <div
        class="d-flex flex-column flex-md-row gap-3 align-items-md-center justify-content-between mb-4"
      >
        <div>
          <h1 class="h3 mb-1">Products</h1>
          <p class="text-secondary mb-0">Browse the latest products.</p>
        </div>
        <div class="d-flex gap-2">
          <input
            id="searchInput"
            class="form-control"
            type="search"
            placeholder="Search products..."
            aria-label="Search products"
          />
          <select
            id="categoryFilter"
            class="form-select"
            aria-label="Filter by category"
          >
            <option value="">All categories</option>
          </select>
        </div>
      </div>
      <div id="pageMessage" class="alert d-none" role="alert"></div>
      <div
        id="productsGrid"
        class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3"
      >
        <div class="col">
          <div class="placeholder-glow">
            <span class="placeholder col-12 product-placeholder"></span>
          </div>
        </div>
        <div class="col">
          <div class="placeholder-glow">
            <span class="placeholder col-12 product-placeholder"></span>
          </div>
        </div>
        <div class="col">
          <div class="placeholder-glow">
            <span class="placeholder col-12 product-placeholder"></span>
          </div>
        </div>
        <div class="col">
          <div class="placeholder-glow">
            <span class="placeholder col-12 product-placeholder"></span>
          </div>
        </div>
      </div>
    </main>
    <footer class="border-top py-3 mt-5">
      <div class="container small text-secondary">Shop Demo · Bootstrap 5</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/store.js"></script>
  </body>
</html>
