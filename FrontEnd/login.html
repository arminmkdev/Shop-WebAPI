<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Shop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/site.css" rel="stylesheet" />
  </head>
  <body class="auth-page">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Shop</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mainNav" class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">
                Cart
                <span id="cartCount" class="badge text-bg-primary">0</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html">My Orders</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="admin.html">Admin</a>
            </li>
          </ul>
          <div class="d-flex gap-2" id="authNav">
            <a class="btn btn-outline-light btn-sm" href="login.html">Login</a>
            <a class="btn btn-primary btn-sm" href="register.html">Register</a>
          </div>
        </div>
      </div>
    </nav>
    <main class="container py-5">
      <div class="card auth-card mx-auto shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-1">Welcome back</h1>
          <p class="text-secondary mb-4">Sign in to your account.</p>
          <div id="formMessage" class="alert d-none"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                id="email"
                class="form-control"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                id="password"
                class="form-control"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
          </form>
          <p class="small text-center mt-3 mb-0">
            No account?
            <a href="register.html">Create one</a>
          </p>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
