<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart | Shop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/site.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Shop</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mainNav" class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">
                Cart
                <span id="cartCount" class="badge text-bg-primary">0</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html">My Orders</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="admin.html">Admin</a>
            </li>
          </ul>
          <div class="d-flex gap-2" id="authNav">
            <a class="btn btn-outline-light btn-sm" href="login.html">Login</a>
            <a class="btn btn-primary btn-sm" href="register.html">Register</a>
          </div>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      <h1 class="h3 mb-4">Shopping Cart</h1>
      <div id="pageMessage" class="alert d-none"></div>
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card">
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Unit price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="cartRows">
                  <tr>
                    <td colspan="5" class="text-center text-secondary py-4">
                      Loading cart...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card">
            <div class="card-body">
              <h2 class="h5">Summary</h2>
              <div class="d-flex justify-content-between mb-3">
                <span>Total</span>
                <strong id="cartTotal">$0.00</strong>
              </div>
              <button id="checkoutButton" class="btn btn-primary w-100">
                Place order
              </button>
              <button
                id="clearCartButton"
                class="btn btn-outline-danger w-100 mt-2"
              >
                Clear cart
              </button>
              <p class="small text-secondary mt-3 mb-0">
                Sign in before using your cart.
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
