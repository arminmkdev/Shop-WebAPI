<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | Shop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/site.css" rel="stylesheet"></head>
<body class="auth-page"><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="index.html">Shop</a><a class="btn btn-outline-light btn-sm" href="index.html">Back to store</a></div></nav>
<main class="container py-5"><div class="card auth-card mx-auto shadow-sm"><div class="card-body p-4"><h1 class="h4 mb-1">Create account</h1><p class="text-secondary mb-4">Register to start shopping.</p><div id="formMessage" class="alert d-none"></div>
<form id="registerForm"><div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" class="form-control" type="email" autocomplete="email" required></div><div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" class="form-control" type="password" autocomplete="new-password" minlength="6" required></div><button class="btn btn-primary w-100" type="submit">Create account</button></form><p class="small text-center mt-3 mb-0">Already registered? <a href="login.html">Login</a></p></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script></body></html>
